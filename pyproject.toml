[project]
name = "asset-agent"
version = "0.1.0"
description = "Low-token 3D asset harness: Blender + AI generators -> Roblox/game-ready assets"
requires-python = ">=3.12"
dependencies = [
    "gradio-client>=2.7.2",
    "mcp>=1.2",
]

[project.scripts]
asset-agent = "asset_agent.cli:main"
asset-agent-mcp = "asset_agent.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
