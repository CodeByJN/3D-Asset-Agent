<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* One dark theme by choice, like the VFX viewer: models are judged against a dark stage, as in Studio at night. */
:root {
  --bg: #0b0d16; --panel: #141a2c; --panel-2: #1a2138; --line: #283153; --fg: #eef1fb; --muted: #94a0c4;
  --accent: #ffc83d; --accent-ink: #1d1600; --good: #3ccf8e; --bad: #ff6b6b; --info: #6cb6ff;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Rubik", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }  /* .empty sets display: grid, which would keep it over the 3D view */
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.45 var(--body); }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.stage { position: relative; min-height: 0; background: radial-gradient(ellipse at 50% 40%, #1a2140 0%, #070910 70%); }
#view { position: absolute; inset: 0; } #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
.hud { position: absolute; left: 16px; top: 14px; right: 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; pointer-events: none; }
.hud h1 { font: 400 30px/1 var(--display); margin: 0; letter-spacing: .01em; }
.ver { font: 500 13px var(--mono); color: var(--accent); }
.count { margin-left: auto; font: 500 12px var(--mono); color: var(--muted); }
.stats { position: absolute; left: 16px; bottom: 14px; right: 16px; pointer-events: none; font: 400 12px/1.5 var(--mono); color: var(--muted); }
.stats .fail { color: var(--bad); }
.tools { position: absolute; right: 14px; top: 52px; display: flex; flex-direction: column; gap: 6px; }
.chip { font: 500 12px var(--body); color: var(--fg); background: rgba(20, 26, 44, .85); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; padding: 18px; overflow-y: auto; }
.badge { align-self: flex-start; font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; border-radius: 5px; padding: 5px 7px; border: 1px solid currentColor; }
.badge.pending { color: var(--accent); } .badge.placed { color: var(--good); } .badge.next { color: var(--info); } .badge.old { color: var(--muted); }
h2 { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.rating { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stars { display: flex; gap: 2px; }
.star { --fill: 0%; position: relative; font-size: 34px; line-height: 1; user-select: none;
        background: linear-gradient(90deg, var(--accent) var(--fill), var(--line) var(--fill));
        -webkit-background-clip: text; background-clip: text; color: transparent; }
.half { position: absolute; top: 0; bottom: 0; width: 50%; padding: 0; border: 0; background: none; cursor: pointer; }
.half.l { left: 0; } .half.r { right: 0; }
.half:disabled { cursor: default; }
.half:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
.score { font: 400 24px/1 var(--display); color: var(--accent); min-width: 3.2em; }
.word { font: 400 12px var(--mono); color: var(--muted); margin-top: 6px; min-height: 16px; }
textarea { width: 100%; min-height: 60px; resize: vertical; font: 400 13px/1.4 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea:focus, .star:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea:disabled { color: var(--muted); }
.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
.buttons .regen { grid-column: 1 / -1; }
.nav { pointer-events: auto; display: flex; gap: 4px; }
.nav button { font: 600 14px var(--body); width: 30px; height: 26px; border-radius: 7px; border: 1px solid var(--line);
              background: rgba(20, 26, 44, .85); color: var(--fg); cursor: pointer; padding: 0; }
.nav button:disabled { opacity: .3; cursor: default; }
.btn { font: 600 14px var(--body); padding: 11px 0; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; }
.btn.place { background: var(--good); border-color: var(--good); color: #04140c; }
.btn.regen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn small { display: block; font: 400 11px var(--body); opacity: .75; }
.btn:disabled { opacity: .35; cursor: default; }
.status { min-height: 40px; font-size: 13px; color: var(--muted); }
.status.err { color: var(--bad); } .status.ok { color: var(--good); }
.hint { font: 400 11px var(--mono); color: var(--muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div id="view" role="img" aria-label="3D model under review"></div>
    <div class="empty" id="empty" hidden></div>
    <div class="hud"><h1 id="name">Asset Review</h1><span class="ver" id="ver"></span><span class="count" id="count"></span>
      <span class="nav"><button id="prev" title="Earlier review (←)" aria-label="Earlier review">‹</button><button id="fwd" title="Later review (→)" aria-label="Later review">›</button></span></div>
    <div class="tools">
      <button class="chip" id="spin" aria-pressed="true" title="Auto-rotate (R)">Rotate</button>
      <button class="chip" id="fx" aria-pressed="true" title="Play the asset's effects (E)">Effects</button>
      <button class="chip" id="beam" aria-pressed="false" title="A light shaft from above, like a shrine (L)">Light shaft</button>
      <button class="chip" id="wire" aria-pressed="false" title="Show the triangles (W)">Wireframe</button>
      <button class="chip" id="player" aria-pressed="false" title="A 5.5-stud R15 figure beside it (P)">Player</button>
      <button class="chip" id="reset" title="Reset the camera (F)">Reset view</button>
    </div>
    <div class="stats" id="stats"></div>
  </section>
  <aside>
    <span class="badge pending" id="badge">waiting</span>
    <div>
      <h2>Rating</h2>
      <div class="rating"><div class="stars" id="stars" role="group" aria-label="Rating"></div><div class="score" id="score"></div></div>
      <div class="word" id="word"></div>
    </div>
    <div><h2><label for="pros">Pros</label></h2><textarea id="pros" placeholder="What works: shape, colours, detail…"></textarea></div>
    <div><h2><label for="cons">Cons</label></h2><textarea id="cons" placeholder="What's off…"></textarea></div>
    <div><h2><label for="notes">Notes for the next version</label></h2><textarea id="notes" placeholder="Anything else: what to change, references, ideas…"></textarea></div>
    <div class="status" id="status" role="status"></div>
    <div class="buttons">
      <button class="btn regen" id="regen" title="Save the rating and have Claude make a new version from your cons and notes">Regenerate<small>make a new version from my notes</small></button>
      <button class="btn" id="keep" title="Save the rating and keep this version as it is">Looks good<small>save rating, keep it</small></button>
      <button class="btn place" id="place" title="Save the rating and put it in the open Roblox Studio place">Place in Studio<small>save rating, add to place</small></button>
    </div>
    <div class="hint">Drag to orbit · scroll to zoom · right-drag to pan · 1–0 rate · ‹ › or ← → earlier reviews</div>
  </aside>
</div>
<script>
// The 3D view (three.js): orbit/zoom/pan, auto-rotate, wireframe, an R15-sized figure for scale and an optional
// light shaft (a spotlight, an additive cone and a floating orb). Roblox imports GLB metres at 0.28 m a stud.
function makeViewer(el) {
  const STUD = 0.28, BG = 0x0b0d16;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  el.append(renderer.domElement);
  const scene = new THREE.Scene(); scene.fog = new THREE.Fog(BG, 8, 20);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.5;
  controls.minDistance = 0.2; controls.maxDistance = 15; controls.maxPolarAngle = Math.PI * 0.53;

  const hemi = new THREE.HemisphereLight(0x9aa4d0, 0x0a0a0c, 0.9); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff3e6, 1.6); key.position.set(2, 4, -3); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0005; scene.add(key);
  const rim = new THREE.DirectionalLight(0x6f8cff, 0.35); rim.position.set(-3, 2, 3); scene.add(rim);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 64), new THREE.MeshStandardMaterial({ color: 0x141826, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  const beamGroup = new THREE.Group(); beamGroup.visible = false; scene.add(beamGroup);
  const spot = new THREE.SpotLight(0xfff3dc, 9, 14, 0.22, 0.6, 1.2);
  spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.bias = -0.0005;
  beamGroup.add(spot, spot.target);
  const beamMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uTime: { value: 0 } },
    vertexShader: "varying float vY; varying vec3 vN; varying vec3 vV; void main(){ vY = uv.y; vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }",
    fragmentShader: "uniform float uTime; varying float vY; varying vec3 vN; varying vec3 vV; void main(){ float edge = pow(abs(dot(vN, vV)), 1.6); float fade = smoothstep(0.0, 0.25, vY) * smoothstep(1.0, 0.55, vY); float shimmer = 0.85 + 0.15*sin(vY*30.0 - uTime*1.5); gl_FragColor = vec4(vec3(1.0,0.96,0.88) * edge * fade * shimmer * 0.22, 1.0); }"
  });
  let beamMesh = null;
  const glow = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.25, "rgba(255,255,255,0.45)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
  })();
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), new THREE.MeshBasicMaterial({ color: 0xdfe8ff }));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, color: 0xbcd0ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.scale.set(0.45, 0.45, 1); orb.add(halo, new THREE.PointLight(0xbcd0ff, 0.8, 3));
  beamGroup.add(orb);

  const figure = new THREE.Group(); figure.visible = false; scene.add(figure);
  {
    const m = new THREE.MeshStandardMaterial({ color: 0x5b5e6b, roughness: 0.8, transparent: true, opacity: 0.85 });
    const part = (w, h, d, x, y) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w * STUD, h * STUD, d * STUD), m); b.position.set(x * STUD, y * STUD, 0); b.castShadow = true; figure.add(b); };
    part(0.9, 2, 1, -0.5, 1); part(0.9, 2, 1, 0.5, 1); part(2, 2, 1, 0, 3);
    part(0.9, 2, 1, -1.5, 3); part(0.9, 2, 1, 1.5, 3); part(1.2, 1.2, 1.2, 0, 4.7);
  }

  let model = null, src = null, wireOn = false;
  const size = new THREE.Vector3(1, 1.7, 1), loader = new THREE.GLTFLoader();
  const eachMat = fn => model && model.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(fn); });

  function frame() {
    const h = Math.max(size.y, 0.3), r = Math.max(h, size.x, size.z);  // wide models (tails, wings) fit too
    controls.target.set(0, h * 0.5, 0);
    camera.position.set(r * 0.9, h * 0.75, -r * 1.6);  // in front: models face -Z after the glTF axis swap
    controls.update();
  }
  function stage() {  // the shaft, orb, shadows and figure follow the model's size
    const h = Math.max(size.y, 0.3), top = new THREE.Vector3(0.9 * h, 3.2 * h, -0.4 * h);
    spot.position.copy(top); spot.target.position.set(0, h * 0.45, 0);
    if (beamMesh) { beamGroup.remove(beamMesh); beamMesh.geometry.dispose(); }
    const len = top.length() * 1.05, geo = new THREE.CylinderGeometry(0.06 * h, 0.55 * h, len, 48, 1, true);
    geo.translate(0, -len / 2, 0);
    beamMesh = new THREE.Mesh(geo, beamMat); beamMesh.position.copy(top);
    beamMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), spot.target.position.clone().sub(top).normalize());
    beamGroup.add(beamMesh);
    const s = Math.max(size.x, size.y, size.z) * 1.2;
    Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s }); key.shadow.camera.updateProjectionMatrix();
    // zoom, fog, floor and lights grow with big assets (bosses), never below the prop-sized defaults
    const R = Math.max(size.x, size.y, size.z);
    controls.maxDistance = Math.max(15, R * 6); camera.far = Math.max(100, R * 20); camera.updateProjectionMatrix();
    scene.fog.near = Math.max(8, R * 2); scene.fog.far = Math.max(20, R * 8);
    floor.scale.setScalar(Math.max(1, R / 3)); spot.distance = Math.max(14, R * 6);
    key.position.set(2, 4, -3).multiplyScalar(Math.max(1, R / 3)); key.shadow.camera.far = Math.max(50, R * 10);
    figure.position.set(-(size.x / 2 + 0.6), 0, 0);  // the far side from the camera, so it never blocks the view
  }


  // ---- effects: the asset's VFX presets (vfx.resolve node trees), played approximately in three.js.
  // ParticleEmitters (in a Part they fill its volume), PointLights and SpotLights; Roblox studs and axes
  // (x right, y up, -z front) become metres with x and z flipped, like the GLB. Beams and trails aren't drawn.
  const fxGroup = new THREE.Group(); scene.add(fxGroup);
  let emitters = [], pxScale = 1;
  const sprites = {};
  function spriteTex(kind) {
    if (sprites[kind]) return sprites[kind];
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d");
    const r = g.createRadialGradient(64, 64, 0, 64, 64, kind === "star" ? 26 : 64);
    r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(kind === "star" ? 0.35 : 0.3, "rgba(255,255,255,0.5)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
    if (kind === "star") {  // four thin rays, like Roblox's sparkles
      g.globalCompositeOperation = "lighter";
      for (const [w, h] of [[128, 7], [7, 128]]) {
        const lg = w > h ? g.createLinearGradient(0, 0, 128, 0) : g.createLinearGradient(0, 0, 0, 128);
        lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(0.5, "rgba(255,255,255,1)"); lg.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = lg; g.fillRect(64 - w / 2, 64 - h / 2, w, h);
      }
    }
    return (sprites[kind] = new THREE.CanvasTexture(c));
  }
  const toV = (x, y, z) => new THREE.Vector3(-x, y, -z);  // Roblox axes -> these
  const rnd = (a, b) => a + Math.random() * (b - a);
  const num = (v, d) => v == null ? d : typeof v === "number" ? v : v.nr ? rnd(v.nr[0], v.nr[1]) : d;
  const maxOf = (v, d) => v == null ? d : typeof v === "number" ? v : v.nr ? v.nr[1] : d;
  function seq(v, d) {  // NumberSequence {ns: [[t, value], ...]} -> f(t)
    if (v == null) return () => d;
    if (typeof v === "number") return () => v;
    const k = v.ns || [[0, d], [1, d]];
    return t => {
      for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
        const a = k[i - 1], b = k[i], u = (t - a[0]) / Math.max(b[0] - a[0], 1e-6);
        return a[1] + (b[1] - a[1]) * u;
      }
      return k[k.length - 1][1];
    };
  }
  function cseq(v) {  // ColorSequence {cs: [[t, r, g, b], ...]} or Color3 {c3: [r, g, b]} -> f(t) [r, g, b]
    if (!v) return () => [1, 1, 1];
    if (v.c3) return () => v.c3;
    const k = v.cs;
    return t => {
      for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
        const a = k[i - 1], b = k[i], u = (t - a[0]) / Math.max(b[0] - a[0], 1e-6);
        return [1, 2, 3].map(j => a[j] + (b[j] - a[j]) * u);
      }
      const e = k[k.length - 1]; return [e[1], e[2], e[3]];
    };
  }
  const DIRS = { Top: [0, 1, 0], Bottom: [0, -1, 0], Right: [1, 0, 0], Left: [-1, 0, 0], Front: [0, 0, -1], Back: [0, 0, 1] };
  const pointsMat = (tex, additive) => new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    uniforms: { uTex: { value: tex }, uScale: { value: 1 } },
    vertexShader: "attribute float aSize; attribute float aAlpha; attribute float aRot; attribute vec3 aColor; uniform float uScale; varying float vAlpha; varying float vRot; varying vec3 vColor; void main(){ vAlpha = aAlpha; vRot = aRot; vColor = aColor; vec4 mv = modelViewMatrix*vec4(position,1.0); gl_PointSize = aSize * uScale / max(-mv.z, 0.01); gl_Position = projectionMatrix*mv; }",
    fragmentShader: "uniform sampler2D uTex; varying float vAlpha; varying float vRot; varying vec3 vColor; void main(){ vec2 p = gl_PointCoord - 0.5; float c = cos(vRot), s = sin(vRot); p = vec2(c*p.x - s*p.y, s*p.x + c*p.y) + 0.5; vec4 t = texture2D(uTex, p); if (vAlpha <= 0.0) discard; gl_FragColor = vec4(vColor * t.rgb, t.a * vAlpha); }"
  });

  class Emitter {
    constructor(p, frame) {
      this.p = p; this.frame = frame;
      this.rate = num(p.Rate, 5);
      const life = maxOf(p.Lifetime, 1);
      this.max = Math.min(3000, Math.ceil(this.rate * life * 1.3) + 4);
      this.size = seq(p.Size, 1); this.trans = seq(p.Transparency, 0); this.color = cseq(p.Color);
      const dir = DIRS[((p.EmissionDirection || {}).enum || "NormalId.Top").split(".")[1]] || DIRS.Top;
      this.dir = toV(...dir).normalize();
      const a = (p.Acceleration || {}).v3 || [0, 0, 0];
      this.accel = toV(...a).multiplyScalar(STUD);
      const sp = (p.SpreadAngle || {}).v2 || [0, 0];
      this.spread = [sp[0] * Math.PI / 180, sp[1] * Math.PI / 180];
      this.drag = num(p.Drag, 0);
      this.parts = [];
      for (let i = 0; i < this.max; i++) this.parts.push({ alive: false, pos: new THREE.Vector3(), vel: new THREE.Vector3() });
      const g = new THREE.BufferGeometry();
      this.posA = new Float32Array(this.max * 3); this.colA = new Float32Array(this.max * 3);
      this.sizeA = new Float32Array(this.max); this.alphaA = new Float32Array(this.max); this.rotA = new Float32Array(this.max);
      g.setAttribute("position", new THREE.BufferAttribute(this.posA, 3));
      g.setAttribute("aColor", new THREE.BufferAttribute(this.colA, 3));
      g.setAttribute("aSize", new THREE.BufferAttribute(this.sizeA, 1));
      g.setAttribute("aAlpha", new THREE.BufferAttribute(this.alphaA, 1));
      g.setAttribute("aRot", new THREE.BufferAttribute(this.rotA, 1));
      this.geo = g;
      const kind = /spark|star|glint|twinkle|shine/i.test(String(p.Texture || "")) ? "star" : "soft";
      this.mat = pointsMat(spriteTex(kind), num(p.LightEmission, 0) >= 0.5);
      this.points = new THREE.Points(g, this.mat); this.points.frustumCulled = false;
      fxGroup.add(this.points);
      this.acc = Math.random();
    }
    spawn() {
      const q = this.parts.find(x => !x.alive); if (!q) return;
      const f = this.frame, s = f.size;
      q.pos.copy(f.pos);
      if (s) q.pos.add(new THREE.Vector3(rnd(-0.5, 0.5) * s[0], rnd(-0.5, 0.5) * s[1], rnd(-0.5, 0.5) * s[2]).multiplyScalar(STUD));
      const d = this.dir.clone();
      const ax = Math.abs(d.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      const u = new THREE.Vector3().crossVectors(d, ax).normalize(), w = new THREE.Vector3().crossVectors(d, u).normalize();
      d.applyAxisAngle(u, rnd(-this.spread[0], this.spread[0])).applyAxisAngle(w, rnd(-this.spread[1], this.spread[1]));
      q.vel.copy(d).multiplyScalar(num(this.p.Speed, 1) * STUD);
      q.age = 0; q.life = Math.max(num(this.p.Lifetime, 1), 0.05);
      q.rot = num(this.p.Rotation, 0) * Math.PI / 180; q.spin = num(this.p.RotSpeed, 0) * Math.PI / 180;
      q.alive = true;
    }
    update(dt) {
      this.acc += this.rate * dt;
      while (this.acc >= 1) { this.spawn(); this.acc -= 1; }
      const damp = Math.exp(-this.drag * dt);
      this.parts.forEach((q, i) => {
        if (q.alive) {
          q.age += dt;
          if (q.age >= q.life) q.alive = false;
        }
        if (!q.alive) { this.alphaA[i] = 0; this.sizeA[i] = 0; return; }
        q.vel.addScaledVector(this.accel, dt).multiplyScalar(damp);
        q.pos.addScaledVector(q.vel, dt); q.rot += q.spin * dt;
        const t = q.age / q.life, c = this.color(t);
        this.posA.set([q.pos.x, q.pos.y, q.pos.z], i * 3); this.colA.set(c, i * 3);
        this.sizeA[i] = Math.max(this.size(t), 0) * STUD; this.alphaA[i] = 1 - Math.min(Math.max(this.trans(t), 0), 1);
        this.rotA[i] = q.rot;
      });
      for (const k of ["position", "aColor", "aSize", "aAlpha", "aRot"]) this.geo.attributes[k].needsUpdate = true;
      this.mat.uniforms.uScale.value = pxScale;
    }
    dispose() { fxGroup.remove(this.points); this.geo.dispose(); this.mat.dispose(); }
  }

  function buildFx(nodes, frame) {
    for (const nd of nodes || []) {
      const p = nd.props || {};
      let sub = frame;
      if (nd.class === "Part" || nd.class === "Attachment") {
        const cf = (p.CFrame || {}).cf || [0, 0, 0];
        sub = { pos: frame.pos.clone().add(toV(cf[0], cf[1], cf[2]).multiplyScalar(STUD)),
                size: nd.class === "Part" ? ((p.Size || {}).v3 || [1, 1, 1]) : null };
      } else if (nd.class === "ParticleEmitter") {
        emitters.push(new Emitter(p, frame));
      } else if (nd.class === "PointLight" || nd.class === "SpotLight") {
        const c = (p.Color || {}).c3 || [1, 1, 1];
        const l = new THREE.PointLight(new THREE.Color(c[0], c[1], c[2]), num(p.Brightness, 1) * 0.6, num(p.Range, 8) * STUD * 1.5, 1);
        l.position.copy(frame.pos); fxGroup.add(l);
      }
      buildFx(nd.children, sub);
    }
  }
  function clearFx() {
    emitters.forEach(e => e.dispose()); emitters = [];
    [...fxGroup.children].forEach(o => fxGroup.remove(o));
  }
  function playFx(fx) {  // effects attach to the host part; here, the model's bounding box
    clearFx();
    const frame = { pos: new THREE.Vector3(0, size.y / 2, 0), size: [size.x / STUD, size.y / STUD, size.z / STUD] };
    for (const e of Object.values(fx || {})) buildFx(e.nodes, frame);
  }


  // ---- animations: an R15 rig (the character's own pieces, or the default rig's boxes) posed every frame
  // from anim.playback: per part [R row-major 3x3, t] in Roblox studs; three.js gets x and z flipped.
  let anim = null, animT = 0, rigParts = {};
  function buildRig(a) {
    const root = new THREE.Group(); rigParts = {};
    for (const [part, [c, s]] of Object.entries(a.boxes)) {
      const g = new THREE.Group(); g.matrixAutoUpdate = false; rigParts[part] = g; root.add(g);
      const pieces = a.rig && a.rig[part];
      if (pieces) {
        for (const pc of pieces) {
          const pos = new Float32Array(pc.t.length);
          for (let i = 0; i < pc.t.length; i += 3) { pos[i] = pc.t[i] + pc.c[0]; pos[i + 1] = pc.t[i + 1] + pc.c[1]; pos[i + 2] = pc.t[i + 2] + pc.c[2]; }
          const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.computeVertexNormals();
          const col = new THREE.Color(...pc.color);
          const m = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7, flatShading: true, side: THREE.DoubleSide,
                                                     emissive: pc.glow ? col : new THREE.Color(0), emissiveIntensity: pc.glow ? 2 : 0 });
          const mesh = new THREE.Mesh(geo, m); mesh.castShadow = true; g.add(mesh);
        }
      } else if (!a.rig) {
        const geo = new THREE.BoxGeometry(s[0], s[1], s[2]); geo.translate(c[0], c[1], c[2]);
        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x8b93ad, roughness: 0.8, side: THREE.DoubleSide }));
        mesh.castShadow = true; g.add(mesh);
      }
    }
    return root;
  }
  function poseRig(i) {
    const f = anim.frames[Math.min(Math.max(i, 0), anim.frames.length - 1)];
    for (const [part, g] of Object.entries(rigParts)) {
      const e = f[part]; if (!e) continue;
      const s = STUD;  // world = flip(x, z) * STUD * (R * p + t)
      g.matrix.set(-s * e[0], -s * e[1], -s * e[2], -s * e[9],
                    s * e[3],  s * e[4],  s * e[5],  s * e[10],
                   -s * e[6], -s * e[7], -s * e[8], -s * e[11],
                    0, 0, 0, 1);
      g.matrixWorldNeedsUpdate = true;
    }
  }
  function tickAnim(dt) {
    if (!anim || !model) return;
    animT += dt;
    const len = anim.length, hold = 0.8;  // one-shots pause on their last frame, then play again
    const t = anim.loop ? animT % len : Math.min(animT % (len + hold), len);
    poseRig(Math.round(t * anim.fps));
  }

  function resize() {
    const w = el.clientWidth || 1, h = el.clientHeight || 1;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    pxScale = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
  }
  new ResizeObserver(resize).observe(el); resize();
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches, clock = new THREE.Clock();
  let last = 0;
  renderer.setAnimationLoop(() => {
    const now = clock.getElapsedTime(), dt = Math.min(now - last, 0.1); last = now;
    const t = still ? 0 : now, h = Math.max(size.y, 0.3);
    if (fxGroup.visible) emitters.forEach(e => e.update(dt));
    tickAnim(still ? 0 : dt);
    beamMat.uniforms.uTime.value = t;
    orb.position.set(-0.55 * h + Math.sin(t * 0.6) * 0.08, h * 1.05 + Math.sin(t * 1.3) * 0.05, -0.2 * h + Math.cos(t * 0.6) * 0.08);
    controls.update(); renderer.render(scene, camera);
  });

  return {
    load(url, fxUrl) {
      if (url === src) return;
      src = url; anim = null;
      clearFx();
      loader.load(url, gltf => {
        if (url !== src) return;  // a newer version was picked while this one loaded
        if (model) scene.remove(model);
        model = gltf.scene;
        model.traverse(o => {
          if (!o.isMesh) return;
          o.castShadow = o.receiveShadow = true;
          (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
            if (m.map) m.map.encoding = THREE.sRGBEncoding;
            if (m.emissive && m.emissive.getHex()) m.emissiveIntensity = 2.5;
            m.wireframe = wireOn;
          });
        });
        const box = new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3());
        box.getSize(size);
        model.position.set(-c.x, -box.min.y, -c.z);
        scene.add(model); stage(); frame();
        if (fxUrl) fetch(fxUrl, { cache: "no-store" }).then(r => r.json()).then(fx => { if (url === src) playFx(fx); }).catch(() => {});
      }, undefined, () => { if (url === src) src = null; });
    },
    loadAnim(url, fxUrl) {
      if (url === src) return;
      src = url; clearFx();
      fetch(url, { cache: "no-store" }).then(r => r.json()).then(a => {
        if (url !== src) return;
        if (model) scene.remove(model);
        anim = a; animT = 0; model = buildRig(a); scene.add(model); poseRig(0);
        model.updateMatrixWorld(true);
        new THREE.Box3().setFromObject(model).getSize(size);
        eachMat(m => { m.wireframe = wireOn; });
        stage(); frame();
        if (fxUrl) fetch(fxUrl, { cache: "no-store" }).then(r => r.json()).then(fx => { if (url === src) playFx(fx); }).catch(() => {});
      }).catch(() => { if (url === src) src = null; });
    },
    clear() { if (model) scene.remove(model); model = null; anim = null; src = null; clearFx(); },
    fx(on) { fxGroup.visible = on; },
    reset: frame,
    spin(on) { controls.autoRotate = on; },
    beam(on) { beamGroup.visible = on; key.visible = !on; hemi.intensity = on ? 0.35 : 0.9; },
    wire(on) { wireOn = on; eachMat(m => { m.wireframe = on; }); },
    player(on) { figure.visible = on; },
  };
}
</script>
<script>
const T = new URLSearchParams(location.search).get("t") || "";
const $ = id => document.getElementById(id);
const q = path => `${path}?t=${encodeURIComponent(T)}`;
const mv = makeViewer($("view"));
let items = [], idx = -1, follow = true, busy = false, hover = 0;
const drafts = {};  // per item id: {stars, pros, cons, notes}, so polling never wipes what you typed
let shownKey = "";

// five stars, each in two halves: 1-10
for (let s = 1; s <= 5; s++) {
  const star = document.createElement("span");
  star.className = "star"; star.textContent = "★"; star.dataset.s = s;
  for (const half of [1, 2]) {
    const b = document.createElement("button");
    const v = (s - 1) * 2 + half;
    b.className = "half " + (half === 1 ? "l" : "r"); b.dataset.v = v;
    b.setAttribute("aria-label", `${v / 2} stars (${v} out of 10)`);
    b.onclick = () => { draft().stars = v; paintStars(v); };
    b.onmouseenter = () => { if (!b.disabled) { hover = v; paintStars(v); } };
    b.onmouseleave = () => { hover = 0; paintStars(draftStars()); };
    star.append(b);
  }
  $("stars").append(star);
}
const item = () => items[idx];
const draft = () => (drafts[item()?.id] ??= {stars: 0, pros: "", cons: "", notes: ""});
const draftStars = () => { const it = item(); return it?.decision ? it.decision.stars || 0 : (drafts[it?.id]?.stars || 0); };
const open = it => it && !it.decision && it.current && !it.placing;
for (const k of ["pros", "cons", "notes"]) $(k).oninput = e => { draft()[k] = e.target.value; };

const WORDS = ["", "awful", "very poor", "poor", "weak", "below average", "okay", "good", "great", "excellent", "perfect"];
function paintStars(n) {
  document.querySelectorAll(".star").forEach(st => {
    const s = +st.dataset.s, fill = n >= s * 2 ? 100 : n === s * 2 - 1 ? 50 : 0;
    st.style.setProperty("--fill", fill + "%");
  });
  $("score").textContent = n ? `${(n / 2).toFixed(1).replace(".0", "")} / 5` : "";
  $("word").textContent = n ? `${n}/10 · ${WORDS[n]}` : "Click a star; the left half gives a half star.";
}
function setStatus(text, cls = "") { $("status").textContent = text; $("status").className = "status " + cls; }

function render(force) {
  const it = item();
  const key = it ? `${it.id}:${JSON.stringify([it.decision, it.current, it.placing, it.error])}` : "none";
  $("count").textContent = items.length ? `${idx + 1} / ${items.length}` : "";
  $("prev").disabled = busy || idx <= 0;
  $("fwd").disabled = busy || idx >= items.length - 1;
  if (!it) {
    $("empty").hidden = false; $("empty").textContent = "Nothing to review yet. Make, build, revise or animate something and it shows up here.";
    mv.clear(); for (const b of ["regen", "keep", "place"]) $(b).disabled = true; return;
  }
  const pending = open(it);
  for (const b of ["regen", "keep", "place"]) $(b).disabled = busy || !pending;
  if (key === shownKey && !force) return;
  shownKey = key;
  $("name").textContent = it.name; $("ver").textContent = `v${it.v}` + (it.kind === "animation" ? " · animation" : "");
  const fail = /(^|\| )FAIL/.test(it.line);
  $("stats").innerHTML = ""; const s = document.createElement("span");
  s.textContent = it.line; if (fail) s.className = "fail"; $("stats").append(s);
  const fx = it.has_fx ? q(`/fx/${it.id}`) : null;
  if (it.has_anim) { $("empty").hidden = true; mv.loadAnim(q(`/anim/${it.id}`), fx); }
  else if (it.has_glb) { $("empty").hidden = true; mv.load(q(`/glb/${it.id}`), fx); }
  else {
    mv.clear(); $("empty").hidden = false;
    $("empty").textContent = "This version has no GLB to show (its export target makes FBX only).";
  }
  const d = it.decision, badge = $("badge");
  if (d) {
    const word = {place: ["placed", "placed in studio"], keep: ["placed", "kept as it is"], next: ["next", "regenerating"]}[d.action];
    badge.className = "badge " + word[0]; badge.textContent = word[1];
    const n = splitNote(d.note);
    $("pros").value = n.pros; $("cons").value = n.cons; $("notes").value = n.notes; paintStars(d.stars || 0);
  } else if (it.placing) {
    badge.className = "badge placed"; badge.textContent = "placing in studio…";
  } else if (!it.current) {
    badge.className = "badge old"; badge.textContent = "older version, not reviewed";
    $("pros").value = $("cons").value = $("notes").value = ""; paintStars(0);
  } else {
    badge.className = "badge pending"; badge.textContent = "waiting for your review";
    const dr = draft(); $("pros").value = dr.pros; $("cons").value = dr.cons; $("notes").value = dr.notes; paintStars(dr.stars);
  }
  for (const k of ["pros", "cons", "notes"]) $(k).disabled = !pending;
  document.querySelectorAll(".half").forEach(b => b.disabled = !pending);
  if (it.error) setStatus(it.error, "err");
  else if (it.placing) setStatus("Placing in Studio…");
  else if (d && d.action === "next" && it.current) setStatus("Sent. Claude is making the next version from your notes; it opens here when it's ready.");
  else if (d && d.action === "keep") setStatus("Rating saved. Nothing will change.", "ok");
  else if (d && d.result) setStatus(d.result, "ok");
  else if (!d) setStatus("");
}
function splitNote(n) {
  const get = k => ((n || "").match(new RegExp(`(?:^|; )${k}: (.*?)(?=; (?:pros|cons|notes): |$)`)) || [, ""])[1];
  return {pros: get("pros"), cons: get("cons"), notes: get("notes")};
}

async function poll() {
  try {
    const r = await fetch(q("/state"), {cache: "no-store"});
    if (r.status === 401) { setStatus("The harness restarted: open the newest review link.", "err"); return; }
    const data = await r.json();
    const before = items.length, wasId = item()?.id;
    items = data.items;
    if (idx < 0 || (follow && items.length !== before)) {
      const pend = items.map((x, i) => open(x) ? i : -1).filter(i => i >= 0);
      idx = pend.length ? pend[pend.length - 1] : items.length - 1;
    } else {
      idx = Math.max(0, items.findIndex(x => x.id === wasId));
    }
    render(item()?.id !== wasId);
  } catch (e) { setStatus("Can't reach the harness. Is the MCP server still running?", "err"); }
}

async function send(action) {
  const it = item(), d = draft();
  if (!d.stars) { setStatus("Give it a star rating first.", "err"); return; }
  if (action === "next" && !(d.cons.trim() || d.notes.trim())) {
    setStatus("Add a con or a note so the next version knows what to change.", "err"); return;
  }
  busy = true; render(true); setStatus({place: "Placing in Studio…", keep: "Saving…", next: "Sending…"}[action]);
  try {
    const r = await fetch(q("/decide"), {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: it.id, action, stars: d.stars, pros: d.pros, cons: d.cons, notes: d.notes})});
    const res = await r.json();
    if (!res.ok) setStatus((res.lines?.length ? res.lines.join(" | ") + " | " : "") + res.error, "err");
    follow = true;
    await poll();
    if (res.ok) render(true);
  } finally { busy = false; render(); }
}

const step = k => { const n = idx + k; if (n >= 0 && n < items.length) { idx = n; follow = n === items.length - 1; render(true); } };
$("prev").onclick = () => step(-1);
$("fwd").onclick = () => step(1);
$("regen").onclick = () => send("next");
$("keep").onclick = () => send("keep");
$("place").onclick = () => send("place");
for (const [id, fn] of [["spin", mv.spin], ["fx", mv.fx], ["beam", mv.beam], ["wire", mv.wire], ["player", mv.player]]) {
  $(id).onclick = () => { const on = $(id).getAttribute("aria-pressed") !== "true"; $(id).setAttribute("aria-pressed", on); fn(on); };
}
$("reset").onclick = () => mv.reset();
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (/^[0-9]$/.test(e.key) && open(item())) { const v = +e.key || 10; draft().stars = v; paintStars(v); }
  else if (k === "r") $("spin").click();
  else if (k === "f") $("reset").click();
  else if (k === "e") $("fx").click();
  else if (k === "l") $("beam").click();
  else if (k === "w") $("wire").click();
  else if (k === "p") $("player").click();
});
poll(); setInterval(poll, 1500);
</script>
